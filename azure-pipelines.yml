trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x'
  displayName: 'Use Python 3.x'

- script: |
    python3 -c '
    import re, sys

    with open("README.md") as f:
        content = f.read()
        lines = content.splitlines()

    print("Verifying markdown tables...")
    in_table = False
    table_num = 0
    header_cols = 0
    errors = []

    for idx, line in enumerate(lines, 1):
        line_str = line.strip()
        if line_str.startswith("|") and line_str.endswith("|"):
            cols = [c.strip() for c in line_str[1:-1].split("|")]
            if not in_table:
                in_table = True
                table_num += 1
                header_cols = len(cols)
            else:
                if len(cols) != header_cols:
                    errors.append(f"Line {idx}: table {table_num} col mismatch expected {header_cols}, got {len(cols)}")
        else:
            in_table = False

    print(f"Verified {table_num} tables.")

    print("Verifying TOC links and headings...")
    toc_links = re.findall(r"\[([^\]]+)\]\(#([^\)]+)\)", content)
    headings = re.findall(r"^(##+)\s+(.+)$", content, re.MULTILINE)
    
    def slugify(title):
        s = title.lower()
        s = re.sub(r"[^\w\- ]", "", s)
        return s.replace(" ", "-")

    heading_slugs = [slugify(h[1]) for h in headings]

    for text, anchor in toc_links:
        if anchor not in heading_slugs:
            errors.append(f"TOC anchor #{anchor} does not match any heading!")

    print(f"Verified {len(toc_links)} TOC links against {len(headings)} headings.")

    if errors:
        for err in errors:
            print("ERROR:", err, file=sys.stderr)
        sys.exit(1)

    print("All validations passed successfully!")
    '
  displayName: 'Validate Markdown Tables & TOC Links'

