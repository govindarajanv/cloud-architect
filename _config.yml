# Site settings
title: Clouds Comparison
locale: en_US
description: >-
  A production-grade architectural reference mapping equivalent cloud services and
  capabilities across Microsoft Azure, Amazon Web Services (AWS), Google Cloud Platform
  (GCP), and the Kubernetes (K8s Native) ecosystem.
version: v1.4.0

# GitHub Pages remote theme (Just the Docs)
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-include-cache
  - jekyll-remote-theme

# Just the Docs theme settings
color_scheme: light
search_enabled: true
enable_copy_code_button: true
last_edit_timestamp: false
heading_anchors: true
toc: true
toc_level: 3

# Just the Docs footer / copyright
aux_links:
  "GitHub Repository":
    - "https://github.com/govindarajanv/cloud-architect"
footer_content: "Maintained by <a href=\"https://github.com/govindarajanv\">govindarajanv</a>"
# end Just the Docs settings

# GitHub Pages project page baseurl
baseurl: "/cloud-architect"
url: "https://govindarajanv.github.io"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
exclude:
  - Gemfile
  - azure-pipelines.yml
  - azure.drawio
